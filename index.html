<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dalma</title><meta name="description" content="A walking compass for iPhone and Apple Watch."><link rel="icon" href="icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Instrument+Serif&display=swap" rel="stylesheet"><style>:root{--bg:#F5F0E6;--panel:#FFFCF6;--text:#17150F;--muted:#6B6457;--faint:#948C7C;--line:rgba(23,21,15,.16);--accent:#C2401A;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E0D0B;--panel:#16120F;--text:#EFE6D4;--muted:#A69D8C;--faint:#6F685E;--line:rgba(239,230,212,.14);--accent:#E2512B}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:48px 20px 80px}
header{display:flex;align-items:center;gap:14px;margin-bottom:40px}header img{width:44px;height:44px;border-radius:10px}
header a{color:var(--text);text-decoration:none;font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.22em;text-transform:uppercase}
h1{font:400 clamp(40px,8vw,56px)/1.05 "Instrument Serif",Georgia,serif;margin:0 0 20px}
h2{font:500 12px/1.4 "IBM Plex Mono",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:44px 0 12px;padding-top:20px;border-top:1px solid var(--line)}
p,li{color:var(--text)}em{font-style:italic}a{color:var(--accent)}code{font:15px "IBM Plex Mono",monospace}
.lede{color:var(--muted);font-size:19px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:24px 0}
footer{margin-top:56px;color:var(--faint);font:12px/1.6 "IBM Plex Mono",monospace;letter-spacing:.06em}</style></head><body><main><header><img src="icon.png" alt=""><a href="">Dalma</a></header><h1>A needle points at where you are going.</h1><p class="lede">Dalma is a walking compass for iPhone and Apple Watch. Straight-line distance, a direction you can walk, and no streets. Places join your logbook only when you stand in them.</p><p><a href="support/">Support</a> · <a href="privacy/">Privacy policy</a></p><footer>© 2026 Alexander Bricken · <a href="support/">Support</a> · <a href="privacy/">Privacy</a></footer></main></body></html>
